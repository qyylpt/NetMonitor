plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    compileSdkVersion 30

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 26
        versionCode 1
        versionName "2.0"
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.3.50"
    api 'com.squareup.okhttp3:okhttp:3.10.0'
}

//配置正式或者测试服务器,默认上传到测试服务器
def isDev = true
def verPrefix = "1.0.0"
def repoUrl = isDev ? "http://s3.qbuild.corp.qihoo.net:8360/nexus/content/repositories/mobilesafe_platform_snpashot/" : "http://s3.qbuild.corp.qihoo.net:8360/nexus/content/repositories/mobilesafe_platform/"
def ver = isDev ? "${verPrefix}-SNAPSHOT" : "$verPrefix"


// 配置Maven发布
afterEvaluate {
    publishing {
        publications {
            // 创建一个名为release的发布
            NetMonitor(MavenPublication) {
                // 关联Android库组件
                from isDev ? components.debug : components.release
                groupId = 'com.qihoo.net.monitor'
                artifactId = 'net_monitor'
                version = ver
            }
        }

        // 配置发布仓库
        repositories {
            // 本地Maven ~/.m2/repository
            mavenLocal()

            // 远程Maven仓库（替换为你的仓库信息）
            maven {
                url = uri(repoUrl) // 仓库URL
                credentials {
                    username = '' // 用户名
                    password = '' // 密码
                }
            }
        }
    }
}
